name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - portfolio

permissions:
  pages: write # Required for GitHub Pages
  id-token: write # Required for OIDC token usage

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        id: repo-checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '22.3.0'

      - name: Install dependencies
        id: install-dependencies
        run: npm install

      - name: Build project
        id: build
        run: npm run build # e.g. "vite build"

      - name: List dist contents
        run: ls -laR ./dist && du -hs ./dist

      - name: Upload dist as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-artifact
          path: ./dist/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      # url: ${{ steps.deployment.outputs.artifact_url }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact # MUST match what you uploaded
          token: ${{ secrets.GITHUB_TOKEN }}
